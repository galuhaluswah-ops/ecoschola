<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062016" />
      <stop offset="100%" stop-color="#02100b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Glow Circle Background -->
  <circle cx="256" cy="256" r="160" fill="#10b981" fill-opacity="0.12" filter="url(#glow)"/>
  
  <!-- Orbit Ring (Cycle / Carbon Loop) -->
  <circle cx="256" cy="256" r="170" stroke="url(#ecoGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="140 60 220 80" stroke-opacity="0.6"/>
  <circle cx="376" cy="136" r="14" fill="#a7f3d0"/>
  <circle cx="136" cy="376" r="10" fill="#34d399"/>
  <circle cx="420" cy="280" r="8" fill="#10b981"/>

  <!-- Sprout & Leaves Shape -->
  <path d="M256 390 C256 320 256 220 256 160" stroke="#a7f3d0" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Main Leaf Right -->
  <path d="M256 220 C320 180 370 200 370 260 C370 310 310 310 256 290 Z" fill="url(#ecoGrad)" filter="url(#glow)"/>
  
  <!-- Secondary Leaf Left -->
  <path d="M256 280 C200 250 150 270 150 320 C150 360 210 360 256 340 Z" fill="#34d399" fill-opacity="0.9"/>
  
  <!-- Sprout Tip -->
  <path d="M256 160 C240 120 256 90 280 90 C290 115 280 145 256 160 Z" fill="#6ee7b7"/>

  <!-- Seed / Earth Foundation -->
  <ellipse cx="256" cy="396" rx="56" ry="14" fill="#10b981" fill-opacity="0.4"/>
</svg>